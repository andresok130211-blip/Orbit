name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          z=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -n "$z" ]; then
            mkdir tmp && unzip -q "$z" -d tmp
            src=$(find tmp -mindepth 1 -maxdepth 1 -type d | head -n1)
            rsync -a --exclude '.github' "$src"/ ./
            rm -rf tmp "$z"
            git config user.name orbit-bot
            git config user.email bot@users.noreply.github.com
            git add -A
            git commit -m "Add Orbit sources"
            git push
          fi
      - id: p
        run: |
          if [ -f app/build.gradle.kts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.p.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.p.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - if: steps.p.outputs.ok == 'true'
        run: gradle assembleDebug --no-daemon
      - if: steps.p.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
